<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histamin-Zauber</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥄</text></svg>">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #e2e8f0; 
            min-height: 100vh;
        }
        .serif { font-family: 'Playfair Display', serif; }
        
        .glass-panel { 
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .text-gradient {
            background: linear-gradient(to right, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .feature-card { transition: all 0.3s ease; cursor: pointer; }
        input[type="checkbox"]:checked + .feature-card {
            background-color: rgba(217, 119, 6, 0.15);
            border-color: #d97706;
        }
        
        .hidden { display: none !important; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-12 px-4 pt-10 sm:pt-16">

    <header class="max-w-4xl mx-auto text-center mb-10 fade-in">
        <h1 class="text-4xl sm:text-5xl font-bold serif mb-3 tracking-tight flex justify-center items-center gap-3">
            <span class="text-3xl sm:text-4xl">🥄</span>
            Histamin-<span class="text-gradient">Zauber</span>
        </h1>
        <p id="main-subtitle" class="text-slate-400 text-sm sm:text-base font-light max-w-lg mx-auto transition-all duration-300 min-h-[3rem]">
            Klassische Gerichte umwandeln – strikt histaminarm & glutenfrei durch echte Lebensmittelchemie.
        </p>
        
        <div class="mt-8">
            <span class="text-[11px] font-bold uppercase tracking-widest text-slate-500 block mb-3">Bitte Modus wählen</span>
            <div class="inline-flex flex-wrap justify-center bg-slate-800/80 rounded-3xl p-1 border border-slate-700/50 shadow-inner gap-1">
                <button onclick="setMode('dish')" id="mode-dish" class="px-4 py-2.5 rounded-full text-[13px] font-semibold transition-all bg-gradient-to-r from-amber-500 to-amber-600 text-white shadow-lg">Rezept</button>
                <button onclick="setMode('fridge')" id="mode-fridge" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Reste</button>
                <button onclick="setMode('cravings')" id="mode-cravings" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Gelüste</button>
                <button onclick="setMode('noob')" id="mode-noob" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Anfänger</button>
                <button onclick="setMode('vital')" id="mode-vital" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Vitalstoffe</button>
                <button onclick="setMode('togo')" id="mode-togo" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Unterwegs</button>
                <button onclick="setMode('alternative')" id="mode-alternative" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Tausch</button>
                <button onclick="setMode('grill')" id="mode-grill" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Grillen</button>
                <button onclick="setMode('baking')" id="mode-baking" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Backen</button>
                <button onclick="setMode('sport')" id="mode-sport" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Sportler</button>
                <button onclick="setMode('soulfood')" id="mode-soulfood" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Scheiß Tag</button>
                <button onclick="setMode('family')" id="mode-family" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Familie</button>
                <button onclick="setMode('holiday')" id="mode-holiday" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Festtag</button>
                <button onclick="setMode('guests')" id="mode-guests" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300 transition-all">Gäste</button>
                <button onclick="setMode('custom')" id="mode-custom" class="px-4 py-2.5 rounded-full text-[13px] font-medium text-indigo-300 transition-all bg-indigo-900/30 border border-indigo-500/30">Freestyle</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto space-y-8 fade-in">
        <section id="step1" class="glass-panel rounded-[2rem] p-6 sm:p-10 relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-amber-600/10 blur-3xl pointer-events-none"></div>

            <div id="freestyle-banner" class="hidden bg-indigo-500/10 border-l-4 border-indigo-500 p-5 rounded-r-2xl mb-8 shadow-inner">
                <h3 class="text-indigo-400 font-bold mb-1">FREESTYLE MODUS AKTIV</h3>
                <p class="text-sm text-indigo-200/80">Histamin-Filter ist deaktiviert. Die KI kocht klassisch nach deinen Regeln.</p>
            </div>

            <div id="input-dish-group" class="mb-8">
                <div class="flex justify-between items-end mb-3 ml-1">
                    <label class="block text-sm font-semibold text-slate-300">Welches Gericht transformieren wir?</label>
                    <button onclick="surpriseMe('dish')" class="text-xs text-amber-500 font-bold">🎲 Überrasch mich</button>
                </div>
                <input type="text" id="main-input" placeholder="z.B. Zürcher Geschnetzeltes, Lasagne..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg focus:border-amber-500 outline-none shadow-inner">
            </div>
            
            <div id="input-fridge-group" class="hidden mb-8">
                <div class="flex justify-between items-end mb-1 ml-1">
                    <label class="block text-sm font-semibold text-slate-300">Deine Vorräte:</label>
                    <button onclick="surpriseMe('fridge')" class="text-xs text-amber-500 font-bold">🎲 Überrasch mich</button>
                </div>
                <textarea id="fridge-input" rows="3" placeholder="z.B. 250g Rinderhack, 3 Karotten..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea>
            </div>

            <div id="input-cravings-group" class="hidden mb-8"><textarea id="cravings-input" rows="3" placeholder="Worauf hast du Lust?" class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-noob-group" class="hidden mb-8"><textarea id="noob-input" rows="3" placeholder="Idiotensicher kochen..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-vital-group" class="hidden mb-8"><textarea id="vital-input" rows="3" placeholder="Z.B. Vitamin C Bombe..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-togo-group" class="hidden mb-8"><textarea id="togo-input" rows="3" placeholder="Pausenbrot alternative..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-alternative-group" class="hidden mb-8"><textarea id="alternative-input" rows="2" placeholder="Was ersetzen wir?" class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-grill-group" class="hidden mb-8"><textarea id="grill-input" rows="3" placeholder="Grillgut / Marinade..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-baking-group" class="hidden mb-8"><textarea id="baking-input" rows="3" placeholder="Backen ohne Hefe..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-sport-group" class="hidden mb-8"><textarea id="sport-input" rows="3" placeholder="High Protein Fokus..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-soulfood-group" class="hidden mb-8"><textarea id="soulfood-input" rows="3" placeholder="Wenn alles blöd ist..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-family-group" class="hidden mb-8"><textarea id="family-input" rows="3" placeholder="Veggie & Fleisch mix..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-holiday-group" class="hidden mb-8"><textarea id="holiday-input" rows="3" placeholder="Festliches Menü..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-guests-group" class="hidden mb-8"><textarea id="guests-input" rows="3" placeholder="Gourmet Level..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg outline-none shadow-inner"></textarea></div>
            <div id="input-custom-group" class="hidden mb-8">
                <input type="text" id="custom-input" placeholder="Gericht..." class="w-full bg-indigo-900/20 border border-indigo-700/50 rounded-2xl px-5 py-4 text-white text-lg mb-4 outline-none">
                <input type="text" id="custom-diet-input" placeholder="Deine Ernährungsregeln..." class="w-full bg-indigo-900/20 border border-indigo-700/50 rounded-2xl px-5 py-4 text-white text-lg outline-none">
            </div>

            <div id="cooking-params" class="mb-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-2">Garmethode</label>
                    <select id="param-method" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-slate-200 outline-none">
                        <option value="KI wählt optimal">KI wählt optimal</option><option value="Herd">Herd</option><option value="Backofen">Backofen</option><option value="Airfryer">Airfryer</option>
                    </select>
                </div>
                <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-2">Zeit</label>
                    <select id="param-time" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-slate-200 outline-none">
                        <option value="30 Min">Schnell (30 Min)</option><option value="60 Min">Normal (60 Min)</option>
                    </select>
                </div>
                <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-2">Portionen</label>
                    <input type="number" id="param-portions" value="2" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-slate-200 outline-none">
                </div>
            </div>

            <div id="nutrition-toggle" class="mb-6">
                <label class="cursor-pointer inline-flex items-center gap-3">
                    <input type="checkbox" id="param-macros" class="accent-amber-500 w-5 h-5">
                    <span class="text-sm text-slate-300">Nährwerte & Kalorien mitberechnen</span>
                </label>
            </div>

            <div id="tolerances-params" class="mb-10">
                <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1 ml-1">Toleranzen, No-Gos & Wünsche (Optional)</label>
                <textarea id="param-tolerances" rows="2" placeholder="Z.B. Ein bisschen Tomatenmark vertrage ich gut. Knoblauch geht gar nicht! Davon bitte ganz viel Petersilie..." class="w-full bg-slate-900/60 border border-slate-700/80 focus:border-amber-500 rounded-2xl px-5 py-4 text-white outline-none shadow-inner"></textarea>
            </div>

            <button onclick="buildPrompt()" id="generate-btn" class="w-full bg-gradient-to-r from-amber-500 to-amber-700 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-[0.98]">Prompt generieren</button>
        </section>

        <section id="step2" class="hidden glass-panel rounded-[2rem] p-6 sm:p-10 fade-in">
            <h3 class="text-xl font-bold mb-4 text-white serif">Dein Master-Prompt</h3>
            <textarea id="result-text" rows="11" class="w-full bg-slate-900/80 text-amber-50 text-sm font-mono p-5 rounded-2xl border border-slate-700/80 outline-none resize-none shadow-inner" readonly></textarea>
            <button onclick="copyToClipboard()" id="copy-btn" class="w-full bg-slate-100 text-slate-900 py-4 rounded-xl font-bold mt-6 uppercase">Kopieren & Archivieren</button>
            <button onclick="resetApp()" class="w-full text-sm text-slate-400 mt-4">← Zurück zur Planung</button>
        </section>

        <section class="glass-panel rounded-3xl p-6">
            <h3 class="text-xs font-bold uppercase text-slate-500 mb-4">Archiv</h3>
            <div id="history-list" class="space-y-2"></div>
        </section>
    </main>

    <script>
        let currentMode = 'dish';
        
        const modeSubtitles = {
            dish: "Klassische Gerichte umwandeln – strikt histaminarm & glutenfrei durch Lebensmittelchemie.",
            fridge: "Mach aus deinen Resten ein histaminarmes 5-Sterne-Gericht.",
            cravings: "Still dein Verlangen – 100% verträglich und ohne Reue.",
            noob: "Idiotensichere, extrem einfache Rezepte für absolute Koch-Anfänger.",
            vital: "Nährstoff-Boost: Optimiere dein Gericht auf Vitamine und Bioverfügbarkeit.",
            togo: "Meal-Prep & Pausenbrot: Kalt lecker, gut transportierbar und histamin-sicher.",
            alternative: "Finde den perfekten Ersatz für problematische Zutaten (z.B. Tomatenmark).",
            grill: "Sicheres BBQ: Marinaden, Dips und Grillideen ohne Reue.",
            baking: "Backen ohne Hefe & Gluten – perfekte Krume durch Stärkekombinationen.",
            sport: "Maximaler Proteingehalt für den Muskelaufbau, 100% histaminarm.",
            soulfood: "Junk-Food-Feeling für miese Tage – deftig, aber verträglich.",
            family: "Modulare Festmähler, die Veganer und Fleisch-Fans am Tisch vereinen.",
            holiday: "Edle Gourmet-Gerichte für besondere Anlässe ohne Verzicht.",
            guests: "Gourmet-Niveau: Deine Gäste werden nicht merken, dass es Diät ist.",
            custom: "Freestyle: Die KI kocht klassisch nach deinen ganz eigenen Regeln."
        };

        function setMode(mode) {
            currentMode = mode;
            const modes = ['dish', 'fridge', 'cravings', 'noob', 'vital', 'togo', 'alternative', 'grill', 'baking', 'sport', 'soulfood', 'family', 'holiday', 'guests', 'custom'];
            
            // UNTERTITEL AKTUALISIEREN
            const subtitleEl = document.getElementById('main-subtitle');
            subtitleEl.style.opacity = '0';
            setTimeout(() => {
                subtitleEl.innerText = modeSubtitles[mode];
                subtitleEl.style.opacity = '1';
            }, 150);

            modes.forEach(m => {
                document.getElementById(`mode-${m}`).className = (m === mode) ? 
                    "px-4 py-2.5 rounded-full text-[13px] font-semibold bg-gradient-to-r from-amber-500 to-amber-600 text-white shadow-lg" : 
                    "px-4 py-2.5 rounded-full text-[13px] font-medium text-slate-300";
                document.getElementById(`input-${m}-group`).classList.toggle('hidden', m !== mode);
            });

            const isAlt = (mode === 'alternative');
            document.getElementById('cooking-params').classList.toggle('hidden', isAlt);
            document.getElementById('nutrition-toggle').classList.toggle('hidden', isAlt);
            document.getElementById('tolerances-params').classList.toggle('hidden', isAlt);
            document.getElementById('freestyle-banner').classList.toggle('hidden', mode !== 'custom');
        }

        function surpriseMe(mode) {
            const data = {
                dish: ["Lasagne al Forno", "Tiramisu", "Beef Wellington", "Spaghetti Carbonara"],
                fridge: ["200g Hähnchen, halber Kürbis", "Hackfleisch, Karotten, Macadamias"],
                noob: ["Maximal 3 Zutaten zusammenwerfen", "Idiotensichere Pasta"],
                vital: ["Vitamin C Bombe für das Immunsystem", "Eisenreiches Power-Meal"],
                togo: ["Sandwich-Alternative ohne Gluten", "Wrap für das Büro"]
            };
            const list = data[mode] || ["Überrasch mich!"];
            const val = list[Math.floor(Math.random() * list.length)];
            const inputField = document.getElementById(mode === 'dish' ? 'main-input' : mode + '-input');
            if(inputField) inputField.value = val;
        }

        function buildPrompt() {
            let inputFieldId = currentMode === 'dish' ? 'main-input' : currentMode + '-input';
            let mainInput = document.getElementById(inputFieldId).value;
            if(!mainInput.trim()) return alert("Feld ausfüllen!");

            const method = document.getElementById('param-method').value;
            const time = document.getElementById('param-time').value;
            const portions = document.getElementById('param-portions').value;
            const tolerances = document.getElementById('param-tolerances').value.trim();
            const macros = document.getElementById('param-macros').checked;

            let prompt = `Rolle: Haubenkoch & Lebensmittelchemiker. 
Aufgabe: Erschaffe Gourmet-Rezept — strikt histaminarm & glutenfrei.
REGEL: Histaminarmut hat Vorrang! Keine Krücken wie Xanthan, nur reine Chemie.

MODUS: ${currentMode.toUpperCase()}
INPUT: ${mainInput}
PARAMETER: Methode: ${method}, Zeit: ${time}, Portionen: ${portions}
${tolerances ? `WICHTIGE TOLERANZEN & WÜNSCHE: ${tolerances}` : ""}

STRUKTUR: Titel, Chemie-Kniff (wie entsteht Geschmack?), Zutaten, Zubereitung ${macros ? ", Nährwerte" : ""}`;

            document.getElementById('result-text').value = prompt;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function copyToClipboard() {
            const text = document.getElementById('result-text').value;
            navigator.clipboard.writeText(text);
            saveToHistory();
            alert("Kopiert & Gespeichert!");
        }

        function saveToHistory() {
            let history = JSON.parse(localStorage.getItem('alchemie_history') || "[]");
            history.unshift({ title: currentMode, date: new Date().toLocaleTimeString() });
            localStorage.setItem('alchemie_history', JSON.stringify(history.slice(0,5)));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('alchemie_history') || "[]");
            list.innerHTML = history.map(h => `<div class="p-2 bg-slate-800/40 border border-slate-700/50 rounded-lg text-[10px] flex justify-between uppercase"><span>${h.title}</span><span class="text-slate-500">${h.date}</span></div>`).join('');
        }

        function resetApp() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        setMode('dish');
        renderHistory();
    </script>
</body>
</html>
