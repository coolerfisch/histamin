<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gluten- & Histamin-Transformator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #e2e8f0; 
            min-height: 100vh;
        }
        .serif { font-family: 'Playfair Display', serif; }
        
        .glass-panel { 
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .text-gradient {
            background: linear-gradient(to right, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .feature-card { transition: all 0.3s ease; }
        input[type="checkbox"]:checked + .feature-card {
            background-color: rgba(217, 119, 6, 0.15);
            border-color: #d97706;
        }
        input[type="checkbox"]:checked + .feature-card .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        
        .hidden { display: none !important; }
        
        select, input[type="number"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-12 px-4 pt-10 sm:pt-16">

    <header class="max-w-3xl mx-auto text-center mb-10 fade-in">
        <h1 class="text-4xl sm:text-5xl font-bold serif mb-3 tracking-tight">
            Rezept-<span class="text-gradient">Transformator</span>
        </h1>
        <p class="text-slate-400 text-sm sm:text-base font-light max-w-lg mx-auto">
            Gourmet-Essen ohne Kompromisse – strikt histaminarm & glutenfrei.
        </p>
        
        <div class="inline-flex flex-wrap justify-center bg-slate-800/80 rounded-3xl p-1 border border-slate-700/50 mt-8 shadow-inner gap-1">
            <button onclick="setMode('dish')" id="mode-dish" class="px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-gradient-to-r from-amber-500 to-amber-600 text-white shadow-lg">Rezept-Planer</button>
            <button onclick="setMode('fridge')" id="mode-fridge" class="px-5 py-2.5 rounded-full text-sm font-medium text-slate-300 hover:text-white transition-all">Resteverwertung</button>
            <button onclick="setMode('cravings')" id="mode-cravings" class="px-5 py-2.5 rounded-full text-sm font-medium text-slate-300 hover:text-white transition-all">Gelüste</button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto space-y-8 fade-in">
        
        <section id="step1" class="glass-panel rounded-[2rem] p-6 sm:p-10 relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-amber-600/10 blur-3xl pointer-events-none"></div>

            <div id="input-dish-group" class="mb-8">
                <label class="block text-sm font-semibold text-slate-300 mb-3 ml-1">Welches klassische Gericht transformieren wir?</label>
                <input type="text" id="main-input" placeholder="z.B. Saftige Lasagne, Pizza Margherita..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg focus:border-amber-500 outline-none transition-all placeholder-slate-600 shadow-inner">
            </div>
            
            <div id="input-fridge-group" class="hidden mb-8">
                <label class="block text-sm font-semibold text-slate-300 mb-1 ml-1">Zutaten vorrätig:</label>
                <textarea id="fridge-input" rows="3" placeholder="z.B. 250g Rinderhack, 3 Karotten, Skyr..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg focus:border-amber-500 outline-none transition-all placeholder-slate-600 shadow-inner"></textarea>
            </div>

            <div id="input-cravings-group" class="hidden mb-8">
                <label class="block text-sm font-semibold text-slate-300 mb-1 ml-1">Worauf hast du gerade Lust?</label>
                <textarea id="cravings-input" rows="3" placeholder="z.B. Ich hätte total Lust auf etwas knuspriges und süßes. Oder: Deftig, cremig und warm..." class="w-full bg-slate-900/50 border border-slate-700/80 rounded-2xl px-5 py-4 text-white text-lg focus:border-amber-500 outline-none transition-all placeholder-slate-600 shadow-inner"></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 ml-1">Garmethode</label>
                    <div class="relative group">
                        <select id="param-method" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-slate-200 font-medium outline-none cursor-pointer pr-10">
                            <option value="Herd">Herd (Pfanne/Topf)</option>
                            <option value="Backofen">Backofen</option>
                            <option value="Airfryer">Airfryer</option>
                            <option value="Waffeleisen">Waffeleisen (Soulfood)</option>
                        </select>
                        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 ml-1">Zeitfenster</label>
                    <div class="relative group">
                        <select id="param-time" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-slate-200 font-medium outline-none cursor-pointer pr-10">
                            <option value="ca. 30 Minuten">Schnell</option>
                            <option value="ca. 60 Minuten">Normal</option>
                            <option value="Viel Zeit">Viel Zeit</option>
                        </select>
                        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 ml-1">Personen</label>
                    <input type="number" id="param-portions" value="2" min="1" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3.5 text-slate-200 font-medium outline-none shadow-inner">
                </div>
            </div>

            <div class="mb-10">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1 ml-1">Persönliche Toleranzen & Ausnahmen</label>
                <textarea id="param-tolerances" rows="2" placeholder="z.B. Kein Spinat. Tomatenmark ist OK. Viel Brokkoli erlaubt." class="w-full bg-slate-900/60 border border-slate-700/80 focus:border-amber-500 rounded-2xl px-5 py-4 text-white outline-none placeholder-slate-600 shadow-inner"></textarea>
            </div>

            <div class="border-t border-slate-700/30 pt-8">
                <h3 class="text-sm font-bold uppercase tracking-widest text-amber-500 mb-4 ml-1">Optionaler Fokus</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="cursor-pointer relative block">
                        <input type="checkbox" id="focus-maillard" class="sr-only">
                        <div class="feature-card h-full p-4 rounded-2xl border border-slate-700 bg-slate-800/40 hover:bg-slate-700/40 shadow-inner">
                            <span class="font-bold text-slate-200 block mb-1">Extra Knusprig</span>
                            <p class="text-[11px] text-slate-400 leading-relaxed">Fokus auf Röstaromen (Maillard-Reaktion).</p>
                        </div>
                    </label>
                    <label class="cursor-pointer relative block">
                        <input type="checkbox" id="focus-emulsion" class="sr-only">
                        <div class="feature-card h-full p-5 rounded-2xl border border-slate-700 bg-slate-800/40 hover:bg-slate-700/40 shadow-inner">
                            <span class="font-bold text-slate-200 block mb-1">Besonders Cremig</span>
                            <p class="text-[11px] text-slate-400 leading-relaxed">Fokus auf Bindung und Textur.</p>
                        </div>
                    </label>
                </div>
            </div>

            <button onclick="buildPrompt()" class="w-full bg-gradient-to-r from-amber-500 to-amber-700 text-white font-black py-5 rounded-2xl mt-10 shadow-2xl hover:scale-[1.01] transition-all uppercase tracking-tighter">
                Rezept berechnen
            </button>
        </section>

        <section id="step2" class="hidden glass-panel rounded-[2rem] p-6 sm:p-10 fade-in border-green-500/30">
            <h3 class="text-xl font-bold mb-4 serif text-white">Dein Prompt ist bereit</h3>
            <textarea id="result-text" rows="12" class="w-full bg-slate-900/80 text-amber-50 text-sm font-mono p-5 rounded-2xl border border-slate-700/80 outline-none resize-none mb-6 shadow-inner" readonly></textarea>
            
            <div class="space-y-4">
                <button onclick="copyToClipboard()" id="copy-btn" class="w-full bg-white text-slate-900 py-4 rounded-xl font-black uppercase shadow-lg transition-all active:scale-[0.98]">Kopieren</button>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <a href="https://chat.openai.com" target="_blank" class="bg-white/5 p-3 rounded-xl text-[10px] font-bold text-center border border-white/5 hover:bg-white/10 transition-colors">ChatGPT</a>
                    <a href="https://claude.ai/new" target="_blank" class="bg-white/5 p-3 rounded-xl text-[10px] font-bold text-center border border-white/5 hover:bg-white/10 transition-colors">Claude</a>
                    <a href="https://gemini.google.com/" target="_blank" class="bg-white/5 p-3 rounded-xl text-[10px] font-bold text-center border border-white/5 hover:bg-white/10 transition-colors">Gemini</a>
                    <a href="https://x.com/i/grok" target="_blank" class="bg-white/5 p-3 rounded-xl text-[10px] font-bold text-center border border-white/5 hover:bg-white/10 transition-colors">Grok</a>
                </div>
                <button onclick="resetApp()" class="w-full text-slate-500 text-xs py-4">← Zurück</button>
            </div>
        </section>

        <section class="glass-panel rounded-2xl p-6">
            <h3 class="text-[9px] font-black uppercase tracking-[0.2em] text-slate-500 mb-4">Archiv</h3>
            <div id="history-list" class="space-y-2"></div>
        </section>

        <footer class="mt-12 mb-8 text-center fade-in">
            <div class="flex flex-col items-center gap-4">
                <a href="https://bunq.me/MAssenbrunner" target="_blank" class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 hover:border-amber-500/50 transition-all group active:scale-95">
                    <span class="text-xl group-hover:rotate-12 transition-transform">☕</span>
                    <span class="text-xs font-bold uppercase tracking-widest text-slate-300 group-hover:text-amber-500">Spendier mir einen Kaffee</span>
                </a>
                <div class="text-slate-500 text-[10px] uppercase tracking-[0.3em] font-semibold">
                    Made with ❤️ & <span class="text-amber-500">Gemini Pro</span>
                </div>
            </div>
        </footer>
        
    </main>

    <script>
        let currentMode = 'dish';
        
        function setMode(mode) {
            currentMode = mode;
            ['dish', 'fridge', 'cravings'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                const group = document.getElementById(`input-${m}-group`);
                if (m === mode) {
                    btn.className = "px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-gradient-to-r from-amber-500 to-amber-600 text-white shadow-lg";
                    group.classList.remove('hidden');
                } else {
                    btn.className = "px-5 py-2.5 rounded-full text-sm font-medium text-slate-300 hover:text-white transition-all";
                    group.classList.add('hidden');
                }
            });
        }

        function buildPrompt() {
            let mainInput = "", target = "";
            if (currentMode === 'dish') {
                mainInput = document.getElementById('main-input').value;
                target = `ZIEL-GERICHT: ${mainInput}`;
            } else if (currentMode === 'fridge') {
                mainInput = document.getElementById('fridge-input').value;
                target = `RESTE-TRANSFORMATION AUS: ${mainInput}`;
            } else {
                mainInput = document.getElementById('cravings-input').value;
                target = `INSPIRATION FÜR GELÜSTE: "${mainInput}"`;
            }

            if(!mainInput.trim()) return alert("Was hättest du heute gerne?");

            let focus = [];
            if(document.getElementById('focus-maillard').checked) focus.push("Max. Röstaromen");
            if(document.getElementById('focus-emulsion').checked) focus.push("Max. Cremigkeit");

            const basePrompt = `Rolle: Haubenkoch & Lebensmittelchemiker. Gourmet-Rezept — strikt histaminarm & glutenfrei. 
WICHTIG: Bei Konflikt hat HISTAMINARMUT Vorrang! Keine künstlichen Binder.

${target}

PARAMETER:
- Methode: ${document.getElementById('param-method').value}
- Zeit: ${document.getElementById('param-time').value}
- Personen: ${document.getElementById('param-portions').value}
- Toleranzen: ${document.getElementById('param-tolerances').value}
- Fokus: ${focus.join(" + ") || "Ausgewogen"}

STRUKTUR:
1. Titel
2. Chemie-Check (Sicherheit & Textur)
3. Zutatenliste
4. Zubereitung`;

            document.getElementById('result-text').value = basePrompt;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('result-text').value);
            document.getElementById('copy-btn').innerHTML = "✅ Kopiert!";
            let title = currentMode === 'dish' ? document.getElementById('main-input').value : "Anfrage";
            saveToHistory(title, document.getElementById('result-text').value);
            setTimeout(() => { document.getElementById('copy-btn').innerHTML = "Kopieren"; }, 2000);
        }

        function saveToHistory(title, prompt) {
            let history = JSON.parse(localStorage.getItem('alchemie_history') || "[]");
            history.unshift({ title, prompt, date: new Date().toLocaleDateString('de-DE') });
            localStorage.setItem('alchemie_history', JSON.stringify(history.slice(0, 10)));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('alchemie_history') || "[]");
            list.innerHTML = history.length ? '' : '<p class="text-[10px] text-slate-600 italic px-2">Leer</p>';
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-white/5 border border-white/5 rounded-xl hover:bg-white/10 cursor-pointer transition-all";
                div.innerHTML = `<div class="flex flex-col truncate pr-2"><span class="font-bold text-slate-200 text-xs truncate">${item.title}</span><span class="text-[9px] text-slate-500 uppercase">${item.date}</span></div><button onclick="restoreHistory(${index})" class="text-[10px] font-bold text-amber-500 shrink-0">Laden</button>`;
                list.appendChild(div);
            });
        }

        function restoreHistory(index) {
            const history = JSON.parse(localStorage.getItem('alchemie_history'));
            document.getElementById('result-text').value = history[index].prompt;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetApp() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        renderHistory();
    </script>
</body>
</html>
