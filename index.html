<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genuss-Transformator | Family Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap');
        
        :root { --mode-color: #f59e0b; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #e2e8f0; 
            min-height: 100vh;
        }
        .serif { font-family: 'Playfair Display', serif; }
        
        .glass-panel { 
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .text-gradient {
            background: linear-gradient(to right, var(--mode-color), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.5s ease;
        }

        .hidden { display: none !important; }
        
        select, input, textarea { font-size: 16px !important; }

        .mode-btn-active {
            background: white !important;
            color: #0f172a !important;
            font-weight: 800;
        }
    </style>
</head>
<body class="pb-20 px-4 pt-10 sm:pt-16">

    <header class="max-w-3xl mx-auto text-center mb-8">
        <div class="inline-block px-4 py-1 rounded-full bg-white/5 border border-white/10 text-[10px] uppercase tracking-[0.2em] text-amber-500 mb-4">
            Family Edition
        </div>
        <h1 class="text-4xl sm:text-5xl font-bold serif mb-3 tracking-tight">
            Genuss-<span id="dynamic-title" class="text-gradient">Transformator</span>
        </h1>
        
        <div class="inline-flex flex-wrap justify-center bg-slate-800/50 backdrop-blur-md rounded-3xl p-1 border border-slate-700/50 mt-6 shadow-2xl gap-1">
            <button onclick="setMode('dish')" id="mode-dish" class="mode-btn-active px-4 py-2 rounded-2xl text-[11px] uppercase transition-all">Rezept</button>
            <button onclick="setMode('fridge')" id="mode-fridge" class="px-4 py-2 rounded-2xl text-[11px] uppercase font-medium text-slate-400 hover:text-white transition-all">Reste</button>
            <button onclick="setMode('cravings')" id="mode-cravings" class="px-4 py-2 rounded-2xl text-[11px] uppercase font-medium text-slate-400 hover:text-white transition-all">Gelüste</button>
            <button onclick="setMode('fitness')" id="mode-fitness" class="px-4 py-2 rounded-2xl text-[11px] uppercase font-medium text-slate-400 hover:text-white transition-all">Sportler</button>
            <button onclick="setMode('soulfood')" id="mode-soulfood" class="px-4 py-2 rounded-2xl text-[11px] uppercase font-medium text-slate-400 hover:text-white transition-all">Soulfood</button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto space-y-8">
        
        <section id="step1" class="glass-panel rounded-[2rem] p-6 sm:p-10 relative overflow-hidden">
            <div id="glow-effect" class="absolute top-0 right-0 -mr-20 -mt-20 w-80 h-80 rounded-full bg-amber-500/10 blur-[100px] pointer-events-none transition-all duration-700"></div>

            <div id="input-dish-group" class="mb-8">
                <label class="block text-sm font-semibold text-slate-300 mb-3 ml-1">Klassiker transformieren:</label>
                <input type="text" id="main-input" placeholder="z.B. Zürcher Geschnetzeltes..." class="w-full bg-slate-900/40 border border-slate-700/50 rounded-2xl px-5 py-4 text-white outline-none focus:border-amber-500 transition-all">
            </div>
            
            <div id="input-fridge-group" class="hidden mb-8">
                <label class="block text-sm font-semibold text-slate-300 mb-1 ml-1">Kühlschrank-Inventar:</label>
                <textarea id="fridge-input" rows="3" placeholder="z.B. 2 Karotten, Brokkoli, Pute..." class="w-full bg-slate-900/40 border border-slate-700/50 rounded-2xl px-5 py-4 text-white outline-none focus:border-emerald-500 transition-all"></textarea>
            </div>

            <div id="input-cravings-group" class="hidden mb-8">
                <label class="block text-sm font-semibold text-slate-300 mb-1 ml-1">Was fehlt euch?</label>
                <textarea id="cravings-input" rows="3" placeholder="z.B. Etwas Knuspriges..." class="w-full bg-slate-900/40 border border-slate-700/50 rounded-2xl px-5 py-4 text-white outline-none focus:border-violet-500 transition-all"></textarea>
            </div>

            <div id="input-fitness-group" class="hidden mb-8">
                <label class="block text-sm font-semibold text-slate-300 mb-1 ml-1">Power-Mahlzeit (High Protein):</label>
                <input type="text" id="fitness-input" placeholder="Wofür braucht ihr heute Energie? (z.B. nach dem Gym)" class="w-full bg-slate-900/40 border border-slate-700/50 rounded-2xl px-5 py-4 text-white outline-none focus:border-blue-500 transition-all">
            </div>

            <div id="input-soulfood-group" class="hidden mb-8">
                <label class="block text-sm font-semibold text-slate-300 mb-1 ml-1">Der Tag war bescheiden...</label>
                <input type="text" id="soulfood-input" placeholder="Was würde euch jetzt aufmuntern?" class="w-full bg-slate-900/40 border border-slate-700/50 rounded-2xl px-5 py-4 text-white outline-none focus:border-rose-500 transition-all">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 ml-1">Garmethode</label>
                    <select id="param-method" class="w-full bg-slate-900/40 border border-slate-700/50 rounded-xl px-4 py-3.5 text-slate-200 outline-none cursor-pointer"><option value="Herd">Herd</option><option value="Backofen">Ofen</option><option value="Airfryer">Airfryer</option><option value="Waffeleisen">Waffeleisen</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 ml-1">Zeit</label>
                    <select id="param-time" class="w-full bg-slate-900/40 border border-slate-700/50 rounded-xl px-4 py-3.5 text-slate-200 outline-none cursor-pointer"><option value="ca. 30 Minuten">Schnell</option><option value="ca. 60 Minuten">Normal</option><option value="Viel Zeit">Viel Zeit</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 ml-1">Personen</label>
                    <input type="number" id="param-portions" value="2" min="1" class="w-full bg-slate-900/40 border border-slate-700/50 rounded-xl px-4 py-3 text-slate-200 outline-none">
                </div>
            </div>

            <div class="mb-10">
                <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">Toleranzen</label>
                <textarea id="param-tolerances" rows="2" placeholder="Spezielle Tabus oder Vorlieben für heute?" class="w-full bg-slate-900/40 border border-slate-700/50 rounded-2xl px-5 py-4 text-white outline-none placeholder-slate-600 shadow-inner"></textarea>
            </div>

            <button onclick="buildPrompt()" class="w-full bg-white text-slate-950 font-black py-5 rounded-2xl shadow-2xl hover:scale-[1.01] active:scale-95 transition-all uppercase tracking-tighter">Rezept berechnen</button>
        </section>

        <section id="step2" class="hidden glass-panel rounded-[2rem] p-6 sm:p-10 border-green-500/30">
            <h3 class="text-xl font-bold mb-6 text-white serif">Euer Plan steht</h3>
            <textarea id="result-text" rows="12" class="w-full bg-slate-900/80 text-amber-50 text-sm font-mono p-5 rounded-2xl border border-white/5 outline-none mb-6" readonly></textarea>
            <div class="space-y-3">
                <button onclick="copyToClipboard()" id="copy-btn" class="w-full bg-white text-slate-900 py-4 rounded-xl font-black uppercase transition-all">Kopieren</button>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <a href="https://chat.openai.com" target="_blank" class="bg-white/5 p-3 rounded-xl text-[10px] font-bold text-center border border-white/5">ChatGPT</a>
                    <a href="https://claude.ai/new" target="_blank" class="bg-white/5 p-3 rounded-xl text-[10px] font-bold text-center border border-white/5">Claude</a>
                    <a href="https://gemini.google.com/" target="_blank" class="bg-white/5 p-3 rounded-xl text-[10px] font-bold text-center border border-white/5">Gemini</a>
                    <a href="https://x.com/i/grok" target="_blank" class="bg-white/5 p-3 rounded-xl text-[10px] font-bold text-center border border-white/5">Grok</a>
                </div>
                <button onclick="resetApp()" class="w-full text-slate-500 text-xs py-4">← Zurück</button>
            </div>
        </section>

        <section class="glass-panel rounded-2xl p-6">
            <h3 class="text-[9px] font-black uppercase tracking-[0.2em] text-slate-500 mb-4">Archiv</h3>
            <div id="history-list" class="space-y-2"></div>
        </section>
        
    </main>

    <script>
        let currentMode = 'dish';
        function setMode(mode) {
            currentMode = mode;
            const config = {
                dish: { color: '#f59e0b', title: 'dish' },
                fridge: { color: '#10b981', title: 'fridge' },
                cravings: { color: '#a855f7', title: 'cravings' },
                fitness: { color: '#3b82f6', title: 'fitness' },
                soulfood: { color: '#f43f5e', title: 'soulfood' }
            };
            
            document.documentElement.style.setProperty('--mode-color', config[mode].color);
            document.getElementById('glow-effect').style.backgroundColor = config[mode].color + '20';
            
            ['dish', 'fridge', 'cravings', 'fitness', 'soulfood'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                const group = document.getElementById(`input-${m}-group`);
                if (m === mode) { btn.className = "mode-btn-active px-4 py-2 rounded-2xl text-[11px] uppercase transition-all"; group.classList.remove('hidden'); }
                else { btn.className = "px-4 py-2 rounded-2xl text-[11px] uppercase font-medium text-slate-400 hover:text-white transition-all"; group.classList.add('hidden'); }
            });
        }

        function buildPrompt() {
            let mainInput = "", promptInstruction = "";
            
            if (currentMode === 'dish') {
                mainInput = document.getElementById('main-input').value;
                promptInstruction = `Transformiere dieses Gericht: ${mainInput}`;
            } else if (currentMode === 'fridge') {
                mainInput = document.getElementById('fridge-input').value;
                promptInstruction = `Erstelle ein Rezept aus diesen Resten: ${mainInput}`;
            } else if (currentMode === 'fitness') {
                mainInput = document.getElementById('fitness-input').value;
                promptInstruction = `FOKUS: HIGH PROTEIN & MUSKELAUFBAU. Erstelle ein proteinreiches Power-Gericht für: ${mainInput}`;
            } else if (currentMode === 'soulfood') {
                mainInput = document.getElementById('soulfood-input').value;
                promptInstruction = `FOKUS: SOULFOOD & TROST. Der Tag war schlecht. Erstelle ein maximal befriedigendes Wohlfühl-Gericht für: ${mainInput}`;
            } else {
                mainInput = document.getElementById('cravings-input').value;
                promptInstruction = `Inspiration für diese Gelüste: ${mainInput}`;
            }

            if(!mainInput.trim()) return;

            const basePrompt = `Rolle: Haubenkoch & Lebensmittelchemiker. Gourmet-Rezept — strikt histaminarm & glutenfrei. 
REGEL: Bei Konflikt hat HISTAMINARMUT Vorrang! Keine künstlichen Binder.

AUFGABE: ${promptInstruction}

PARAMETER:
- Methode: ${document.getElementById('param-method').value}
- Zeit: ${document.getElementById('param-time').value}
- Personen: ${document.getElementById('param-portions').value}
- Toleranzen: ${document.getElementById('param-tolerances').value}

STRUKTUR:
1. Titel
2. Chemie-Check (Warum sicher & lecker?)
3. Zutatenliste
4. Schritt-für-Schritt Zubereitung`;

            document.getElementById('result-text').value = basePrompt;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('result-text').value);
            document.getElementById('copy-btn').innerHTML = "✅ Kopiert!";
            let title = currentMode.toUpperCase();
            saveToHistory(title, document.getElementById('result-text').value);
            setTimeout(() => { document.getElementById('copy-btn').innerHTML = "Kopieren"; }, 2000);
        }

        function saveToHistory(title, prompt) {
            let history = JSON.parse(localStorage.getItem('alchemie_history') || "[]");
            history.unshift({ title, prompt, date: new Date().toLocaleDateString('de-DE') });
            localStorage.setItem('alchemie_history', JSON.stringify(history.slice(0, 10)));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('alchemie_history') || "[]");
            list.innerHTML = history.length ? '' : '<p class="text-[10px] text-slate-600 italic">Leer</p>';
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-white/5 border border-white/5 rounded-xl hover:bg-white/10 cursor-pointer";
                div.innerHTML = `<div class="flex flex-col truncate pr-2"><span class="font-bold text-slate-200 text-xs truncate">${item.title}</span><span class="text-[9px] text-slate-500 uppercase">${item.date}</span></div><button onclick="restoreHistory(${index})" class="text-[10px] font-bold text-amber-500 shrink-0">Laden</button>`;
                list.appendChild(div);
            });
        }

        function restoreHistory(index) {
            const history = JSON.parse(localStorage.getItem('alchemie_history'));
            document.getElementById('result-text').value = history[index].prompt;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function resetApp() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        renderHistory();
    </script>
</body>
</html>
