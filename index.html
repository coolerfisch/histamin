<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet-Alchemie</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D97706">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .serif { font-family: 'Playfair Display', serif; }
        .accent-amber { color: #d97706; }
        .bg-amber-gold { background-color: #d97706; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none; }
        input:checked + .toggle-label { background-color: #d97706; border-color: #d97706; }
    </style>
</head>
<body class="min-h-screen pb-12 px-4 pt-8">

    <header class="max-w-2xl mx-auto text-center mb-8">
        <h1 class="text-4xl font-bold serif mb-2">Gourmet-<span class="accent-amber">Alchemie</span></h1>
        <div class="flex justify-center gap-4 mt-4">
            <button onclick="setMode('dish')" id="mode-dish" class="px-4 py-2 rounded-full text-sm font-semibold border border-amber-600 bg-amber-600">Rezept-Planer</button>
            <button onclick="setMode('fridge')" id="mode-fridge" class="px-4 py-2 rounded-full text-sm font-semibold border border-amber-600">Kühlschrank-Modus</button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto space-y-6">
        
        <section id="step1" class="glass rounded-3xl p-6 shadow-2xl">
            <div id="input-dish-group">
                <label class="block text-sm font-medium text-gray-400 mb-2">Welches Gericht soll transformiert werden?</label>
                <input type="text" id="main-input" placeholder="z.B. Lasagne, Schnitzel..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-600 outline-none transition-all">
            </div>
            
            <div id="input-fridge-group" class="hidden">
                <label class="block text-sm font-medium text-gray-400 mb-2">Welche Zutaten hast du vorrätig?</label>
                <textarea id="fridge-input" rows="3" placeholder="z.B. Zucchini, Rinderhack, Pastinaken..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-600 outline-none transition-all"></textarea>
            </div>

            <div class="mt-6 border-t border-slate-700 pt-4">
                <p class="text-xs font-bold uppercase tracking-widest text-amber-500 mb-3">Erweiterte Alchemie-Fokus</p>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 cursor-pointer p-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition-colors">
                        <input type="checkbox" id="focus-maillard" class="hidden">
                        <div class="w-4 h-4 border border-amber-600 rounded-sm toggle-label"></div>
                        <span class="text-xs">Maillard-Reaktion</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer p-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition-colors">
                        <input type="checkbox" id="focus-emulsion" class="hidden">
                        <div class="w-4 h-4 border border-amber-600 rounded-sm toggle-label"></div>
                        <span class="text-xs">Stabile Emulsionen</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer p-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition-colors">
                        <input type="checkbox" id="focus-starch" class="hidden">
                        <div class="w-4 h-4 border border-amber-600 rounded-sm toggle-label"></div>
                        <span class="text-xs">Stärkeverkleisterung</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer p-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition-colors">
                        <input type="checkbox" id="focus-umami" class="hidden">
                        <div class="w-4 h-4 border border-amber-600 rounded-sm toggle-label"></div>
                        <span class="text-xs">Natürliches Umami</span>
                    </label>
                </div>
            </div>

            <div class="mt-6 grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Methode</label>
                    <select id="param-method" class="w-full bg-slate-800 rounded-lg p-2 text-sm border-none outline-none">
                        <option>Herd</option><option>Backofen</option><option>Airfryer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-gray-500 mb-1">Zeit</label>
                    <select id="param-time" class="w-full bg-slate-800 rounded-lg p-2 text-sm border-none outline-none">
                        <option>30 Min</option><option>60 Min</option><option>Viel Zeit</option>
                    </select>
                </div>
            </div>

            <button onclick="buildPrompt()" class="w-full bg-amber-gold hover:bg-amber-700 text-white font-bold py-4 rounded-xl mt-6 shadow-lg shadow-amber-900/20 transition-all active:scale-95">
                Alchemistischen Prompt bauen
            </button>
        </section>

        <section id="step2" class="hidden glass rounded-3xl p-6">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <span class="text-green-500">✓</span> Prompt bereit
            </h3>
            <textarea id="result-text" rows="8" class="w-full bg-slate-900 text-slate-300 text-xs font-mono p-4 rounded-xl border border-slate-700 mb-4 outline-none" readonly></textarea>
            
            <div class="flex flex-col gap-3">
                <button onclick="copyToClipboard()" id="copy-btn" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-semibold flex justify-center items-center gap-2">
                    Kopieren & Speichern
                </button>
                <div class="grid grid-cols-2 gap-3">
                    <a href="https://chat.openai.com" target="_blank" class="bg-emerald-700 hover:bg-emerald-600 text-center py-2 rounded-lg text-xs font-bold">ChatGPT öffnen</a>
                    <a href="https://claude.ai" target="_blank" class="bg-indigo-700 hover:bg-indigo-600 text-center py-2 rounded-lg text-xs font-bold">Claude öffnen</a>
                </div>
                <button onclick="resetApp()" class="text-xs text-slate-500 underline mt-2">Neu starten</button>
            </div>
        </section>

        <section class="glass rounded-3xl p-6">
            <h3 class="text-sm font-bold uppercase tracking-widest text-slate-500 mb-4">Letzte Kreationen</h3>
            <div id="history-list" class="space-y-2">
                </div>
        </section>
    </main>

    <script>
        let currentMode = 'dish';
        
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-dish').classList.toggle('bg-amber-600', mode === 'dish');
            document.getElementById('mode-fridge').classList.toggle('bg-amber-600', mode === 'fridge');
            document.getElementById('input-dish-group').classList.toggle('hidden', mode === 'fridge');
            document.getElementById('input-fridge-group').classList.toggle('hidden', mode === 'dish');
        }

        function buildPrompt() {
            const mainInput = document.getElementById(currentMode === 'dish' ? 'main-input' : 'fridge-input').value;
            if(!mainInput) return alert("Eingabe fehlt!");

            let focusPoints = [];
            if(document.getElementById('focus-maillard').checked) focusPoints.push("Maximierung der Maillard-Reaktion für Röstaromen");
            if(document.getElementById('focus-emulsion').checked) focusPoints.push("Stabile, cremige Emulsionen ohne Zusatzstoffe");
            if(document.getElementById('focus-starch').checked) focusPoints.push("Gezielte Stärkeverkleisterung für Texturbindung");
            if(document.getElementById('focus-umami').checked) focusPoints.push("Natürliche Umami-Synergien (z.B. durch histaminarme Pilze/Algen)");

            const method = document.getElementById('param-method').value;
            const time = document.getElementById('param-time').value;

            const basePrompt = `Rolle: Haubenkoch & Lebensmittelchemiker. Aufgabe: Gourmet-Version (Strikt glutenfrei, histaminarm). 
Regel: Keine Xanthan/Guarkernmehl-Krücken. Textur nur durch Chemie (Brühstück, Emulsion, Stärke).
${currentMode === 'dish' ? `Gericht: ${mainInput}` : `Entwickle ein Gourmet-Rezept aus diesen Zutaten: ${mainInput}`}
Methode: ${method}, Zeit: ${time}.
Fokus: ${focusPoints.join(", ") || "Standard Gourmet-Alchemie"}.
Struktur: Titel, Physik-Kniff dahinter, Zutaten, Zubereitung.`;

            document.getElementById('result-text').value = basePrompt;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function copyToClipboard() {
            const text = document.getElementById('result-text').value;
            navigator.clipboard.writeText(text);
            const btn = document.getElementById('copy-btn');
            btn.innerText = "✓ Kopiert & Archiviert";
            btn.classList.replace('bg-slate-700', 'bg-green-700');
            saveToHistory(currentMode === 'dish' ? document.getElementById('main-input').value : "Kühlschrank-Mix", text);
            setTimeout(() => {
                btn.innerText = "Kopieren & Speichern";
                btn.classList.replace('bg-green-700', 'bg-slate-700');
            }, 2000);
        }

        function saveToHistory(title, prompt) {
            let history = JSON.parse(localStorage.getItem('alchemie_history') || "[]");
            history.unshift({ title, prompt, date: new Date().toLocaleDateString() });
            history = history.slice(0, 10);
            localStorage.setItem('alchemie_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('alchemie_history') || "[]");
            list.innerHTML = history.length ? '' : '<p class="text-xs text-slate-600 italic">Noch keine Historie vorhanden.</p>';
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-slate-800/30 rounded-xl text-xs";
                div.innerHTML = `<div><span class="font-bold text-amber-500">${item.title}</span> <span class="text-slate-500 ml-2">${item.date}</span></div>
                                 <button onclick="restoreHistory(${index})" class="text-amber-500 underline">Laden</button>`;
                list.appendChild(div);
            });
        }

        function restoreHistory(index) {
            const history = JSON.parse(localStorage.getItem('alchemie_history'));
            document.getElementById('result-text').value = history[index].prompt;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function resetApp() {
            document.getElementById('main-input').value = "";
            document.getElementById('fridge-input').value = "";
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        renderHistory();

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
